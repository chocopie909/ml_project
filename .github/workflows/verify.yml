name: Verify ML project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests and every notebook
        run: python scripts/verify.py
      - name: Save results and executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-project-results
          path: |
            reports/
            notebooks/
